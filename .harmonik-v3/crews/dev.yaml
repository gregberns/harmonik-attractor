# Development team for PAS: builds the plan's tickets in parallel, one git
# worktree and branch per ticket; one integrator merges to main.
# The operator launches it from a plain terminal in this repo (Q64):
#   hk3 crew start dev --team dev
# (/Users/gb/github/harmonik-v3/harmonik-v3 crew start dev --team dev if hk3
# isn't on PATH). Don't launch from inside another hk3 agent: it passes on
# all its HK3_* and KEEPER_* settings (project, prefix, team...), so the
# crew gets that agent's project and label prefix.
description: Build the attractor plan's tickets into PAS in parallel, one worktree and branch per ticket, with reviewed plans, reviewed and tested code, and one integrator merging to main.
workflow: build-branches
members:
  - role: captain
    responsibility: Hands out every ticket whose blockers are merged to a free builder, tracks which ticket is in which worktree, and reports progress to the operator.
  - role: planner
    responsibility: Breaks each handed-out ticket into ordered build steps and sends them to plan-reviewer.
  - role: reviewer
    name: plan-reviewer
    responsibility: Reviews each build plan against the ticket and the spec before building starts.
  - role: builder
    count: 2
    responsibility: Builds one ticket at a time in its own worktree (.worktrees/<nn>-<slug>, branch ticket/<nn>-<slug> from main), handing independent pieces to subagents in sub-worktrees, committing each verified change with its docs and tests.
  - role: reviewer
    name: code-reviewer
    responsibility: Reviews each change in a ticket's worktree for correctness, the spec and the AGENTS.md rules.
  - role: tester
    responsibility: Tests each ticket in its worktree against the ticket's acceptance checks with the fake agents and reports defects to its builder.
  - role: builder
    name: integrator
    responsibility: The only member who updates main; merges passed tickets one at a time (rebase and resolve in the ticket worktree, full checks, fast-forward main in the root checkout, push), then removes the worktree and branch.
