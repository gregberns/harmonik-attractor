description: Build the plan's tickets one at a time (the crew shares one checkout), each on its own branch from main; review and test on the branch; one integrator merges to main after the full checks and pushes it.
input: the ready plan in this repo, plans/2026-10-04-attractor/ (spec.md, tickets/, README.md ticket table and status).
steps:
  - name: pick up
    who: captain
    does: When no ticket is in flight, takes the next ticket whose blockers are merged, per the plan README, and gives it to the planner.
  - name: plan
    who: planner
    does: Breaks the ticket into ordered build steps with their tests and sends them to plan-reviewer.
  - name: review plan
    who: plan-reviewer
    does: Reviews the build steps against the ticket and spec and sends findings back until ready, then tells the captain and builder.
  - name: branch
    who: builder
    does: Checks out main and cuts ticket/<nn>-<slug> from it (only while reviewer and tester are idle); may push the branch.
  - name: build
    who: builder
    does: Implements the steps on the ticket branch, test first, committing each verified change with its docs; tells code-reviewer and tester what changed.
  - name: review
    who: code-reviewer
    does: Reviews each change on the branch and reports findings to the builder, who fixes them on the branch.
  - name: test
    who: tester
    does: Runs the ticket's acceptance checks on the branch with cargo test and the fake agents, reports defects to the builder, and tells the integrator and captain when the branch passes.
  - name: integrate
    who: integrator
    does: On the passed branch, rebases onto main and resolves all conflicts; runs cargo test --workspace, cargo fmt --all -- --check and cargo clippy --workspace --all-targets (no new warnings); marks the ticket done in the plan README; fast-forwards main with git fetch . HEAD:main; pushes main; deletes the branch; tells the captain. Sends the branch back to the builder if a check fails.
  - name: report
    who: captain
    does: Reports the merged ticket to the operator and starts the next one, which branches from the updated main.
