# The agent profiles PAS ships with. A project replaces a profile by name,
# or adds one, in `pas.toml` `[agents.<name>]`; `[defaults]` fills any field
# no profile in an `inherit_from` chain sets.

[defaults]
timeout = "10m"
kill_grace = "10s"
# How long a rate-limited agent may keep waiting and retrying inside one
# invocation (claude-p re-spawns; pi sets its own retry). "0s": no waiting.
rate_limit_window = "2m"

[defaults.env]
# Removed from every agent's environment, so an agent bills the operator's
# subscription, never an API key it inherited. A profile that sets its own
# `env.remove` replaces this list.
remove = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "ANTHROPIC_BASE_URL",
    "OPENAI_API_KEY",
    "CLAUDE_CODE_USE_BEDROCK",
    "CLAUDE_CODE_USE_VERTEX",
]

# A node that runs again continues its session (design §1): the first run
# gets `--session-id`, a retry or loop-back `--resume` with the same id.
# Session files persist under `~/.claude`.
[profiles.claude]
mechanism = "claude-p"
command = ["claude"]
args = [
    "--dangerously-skip-permissions",
    "--strict-mcp-config",
    "--disable-slash-commands",
]
session_args = ["--session-id", "{session_id}"]
resume_args = ["--resume", "{session_id}"]
model_args = ["--model", "{model}"]
reasoning_args = ["--effort", "{reasoning}"]

# `codex-exec` appends `--cd <workdir>` (not when continuing: `exec resume`
# takes none) and the prompt (positional, last). Codex can't be given a
# session id; it reports its `thread_id`, which a retry resumes. Session
# files persist under `~/.codex`.
[profiles.codex]
mechanism = "codex-exec"
command = ["codex"]
args = ["exec", "--json", "--yolo", "--skip-git-repo-check"]
resume_command = [
    "{command}",
    "exec",
    "resume",
    "{session_id}",
    "--json",
    "--skip-git-repo-check",
    "--dangerously-bypass-approvals-and-sandbox",
]
model_args = ["--model", "{model}"]

# `gemini` puts `--output-format <json|stream-json>` (probed with `--help`)
# right after the command, and appends the prompt (positional, last).
[profiles.gemini]
mechanism = "gemini"
command = ["gemini"]
args = ["--approval-mode", "yolo"]
model_args = ["--model", "{model}"]
