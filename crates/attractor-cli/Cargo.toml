[package]
name = "attractor-cli"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Pascal's Discrete Attractor — DOT-based pipeline runner for AI workflows"

[[bin]]
name = "pas"
path = "src/main.rs"

[features]
# Off by default; release builds enable it (see install.sh).
monitor = ["dep:attractor-monitor"]

[dependencies]
attractor-types = { path = "../attractor-types" }
attractor-dot = { path = "../attractor-dot" }
attractor-llm = { path = "../attractor-llm" }
attractor-tools = { path = "../attractor-tools" }
attractor-pipeline = { path = "../attractor-pipeline" }
attractor-agent-handler = { path = "../attractor-agent-handler" }
attractor-handler-claude-p = { path = "../attractor-handler-claude-p" }
attractor-handler-codex-exec = { path = "../attractor-handler-codex-exec" }
attractor-handler-gemini = { path = "../attractor-handler-gemini" }
attractor-handler-pi = { path = "../attractor-handler-pi" }
attractor-journal = { path = "../attractor-journal" }
attractor-quality = { path = "../attractor-quality" }
attractor-monitor = { path = "../attractor-monitor", optional = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
toml = "1"
dialoguer = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
uuid = { workspace = true }
